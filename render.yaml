services:
  # Backend Web Service (Python FastAPI)
  - type: web
    name: ipsakti-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NVIDIA_API_KEY
        value: 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

  # Frontend Static Site (React Vite)
  - type: web
    name: ipsakti-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: ipsakti-backend
          property: host
